[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    # The app targets FastAPI 0.109, where on_event is still the documented API.
    "ignore:.*on_event is deprecated.*:DeprecationWarning",
    "ignore:.*datetime.datetime.utcnow.*:DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".git", "__pycache__", "build", "node_modules", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "S",   # bandit security checks
]
ignore = [
    "S101",  # assert is expected in tests
    "B008",  # FastAPI's Depends() in defaults is the documented pattern
    # Flags token_type="bearer" and similar as hardcoded passwords. Real secret
    # detection is gitleaks' job in CI; this check is noise here.
    "S106",
]

[tool.ruff.lint.per-file-ignores]
# Tests set env before importing backend, and use obvious throwaway credentials.
"backend/tests/*" = ["E402", "S105", "S106", "S107"]
