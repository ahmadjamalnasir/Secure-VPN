services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: vpn_admin
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: shieldvpn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://vpn_admin:secure_password@db:5432/shieldvpn
      - SECRET_KEY=supersecretkey_change_in_production
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    depends_on:
      - db
    restart: always

  admin-dashboard:
    build:
      context: ./admin-dashboard
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
