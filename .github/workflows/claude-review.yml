name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts; they change too often to be worth reviewing.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for Shield VPN, a WireGuard VPN product
            with a FastAPI backend, a React admin dashboard and an Android
            client. The PR branch is already checked out.

            Read ROADMAP.md first. It defines what production-ready means for
            this project and which step this PR belongs to. Judge the change
            against that plan.

            Prioritise, in this order:

            1. Security. This project has a history of shipping secrets and
               broken auth: a publicly-known JWT signing key was live because
               an env var name did not match, and credentials were committed
               to the repo. Scrutinise anything touching authentication,
               authorisation, token handling, configuration loading, secret
               management or CORS. Flag any new hardcoded credential, URL or
               key, and any endpoint that should require auth but does not.

            2. Does it actually run. Two container images in this repo could
               not build at all while appearing healthy, because a stale image
               was running and nothing verified the source. Be sceptical of
               changes to Dockerfiles, imports, entrypoints and dependency
               pins. Ask whether CI genuinely exercises the changed path.

            3. Correctness bugs with a concrete failure scenario. Describe the
               inputs or state that produce the wrong result. Do not report
               style preferences or speculative concerns.

            4. Scope. Flag work that belongs to a later roadmap step and has
               leaked into this PR, and roadmap items this PR claims to
               complete but does not.

            Be concise and specific. If the PR is sound, say so briefly rather
            than manufacturing findings. Cite file and line for every point.

            Use `gh pr comment` for the overall verdict.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for specific code issues.
            Only post GitHub comments - do not submit review text as messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
