server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA owns its routes; anything that is not a real file falls through
    # to index.html so a refresh on /servers does not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API. The browser only ever talks to this container, so no
    # CORS negotiation and no backend hostname baked into the bundle.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed assets are immutable; index.html must never be cached or users
    # keep loading a stale bundle after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
